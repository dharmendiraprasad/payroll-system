<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll System | Front-End Enterprise Application</title>
  <meta name="description" content="Automated Payroll Processing System front-end web application with role-based access control, statutory deductions, salary calculation, payslip generation, and leave management." />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">PS</div>
        <div class="brand-text">
          <h2>PAYROLL SYSTEM</h2>
          <span>Enterprise Prototype</span>
        </div>
      </div>

      <div class="nav-section-title">DHARMENDIRA'S TOPICS</div>
      <ul class="nav-menu">
        <li class="nav-item active">
          <button data-tab="uc1-calculate-salary">
            <span>⚡ Calculate Salary</span>
            <span class="author-badge">UC 1</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="uc4-master-data">
            <span>📂 Master & Salary Data</span>
            <span class="author-badge">UC 4</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="uc5-statutory-tax">
            <span>🏛️ Statutory Tax Rules</span>
            <span class="author-badge">UC 5</span>
          </button>
        </li>
      </ul>

      <div class="nav-section-title" style="margin-top: 1.25rem;">BALAMURUGAN'S TOPICS</div>
      <ul class="nav-menu">
        <li class="nav-item">
          <button data-tab="uc2-generate-payslip">
            <span>📄 Generate Payslip</span>
            <span class="author-badge">UC 2</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="uc3-leave-attendance">
            <span>📅 Leave & Attendance</span>
            <span class="author-badge">UC 3</span>
          </button>
        </li>
        <li class="nav-item">
          <button data-tab="uc6-user-roles">
            <span>🔐 User Roles & Access</span>
            <span class="author-badge">UC 6</span>
          </button>
        </li>
      </ul>

      <!-- Active Role Switcher -->
      <div class="user-profile-box">
        <div style="font-weight: 600; font-size: 0.8rem; color: var(--accent-blue); margin-bottom: 0.35rem;">
          ⚙️ Role Simulator
        </div>
        <label for="global-role-select">Active Permission Context:</label>
        <select id="global-role-select">
          <option value="HR Administrator">HR Administrator</option>
          <option value="Manager">Manager</option>
          <option value="Employee">Employee</option>
          <option value="System Administrator">System Administrator</option>
        </select>
        
        <button class="btn btn-secondary btn-sm" style="width: 100%; margin-top: 0.75rem;" onclick="PayrollApp.resetDemoData()">
          🔄 Reset Demo Data
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <!-- Top Bar Header -->
      <header class="top-header">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <button id="mobile-nav-toggle" class="btn btn-secondary btn-sm" style="display: none; padding: 0.5rem 0.75rem;">☰ Menu</button>
          <div class="page-title">
            <h1>Automated Payroll Management System</h1>
            <p>Front-End Prototype • Dharmendira Prasad P (24MIS0073) & Balamurugan D (24MIS0096)</p>
          </div>
        </div>

        <div class="header-actions">
          <div class="status-pill" title="Client-Side UX Role Simulation Engine">
            <span class="status-dot"></span>
            <span id="current-role-badge">HR Administrator</span>
          </div>
        </div>
      </header>

      <!-- Content Body -->
      <main class="content-body">
        <!-- Use Case Panels -->
        <section id="uc1-calculate-salary" class="view-panel active"></section>
        <section id="uc4-master-data" class="view-panel"></section>
        <section id="uc5-statutory-tax" class="view-panel"></section>
        <section id="uc2-generate-payslip" class="view-panel"></section>
        <section id="uc3-leave-attendance" class="view-panel"></section>
        <section id="uc6-user-roles" class="view-panel"></section>
      </main>
    </div>
  </div>

  <!-- Printable Payslip Modal Popup -->
  <div id="payslip-modal" class="modal-overlay">
    <div class="modal-container">
      <button class="modal-close" onclick="BalamuruganModules.closePayslipModal()">✕</button>
      <div id="payslip-modal-body"></div>
    </div>
  </div>

  <!-- Generic Employee Add/Edit Modal -->
  <div id="employee-modal" class="modal-overlay">
    <div class="modal-container" style="max-width: 650px;">
      <button class="modal-close" onclick="DharmendiraModules.closeEmployeeModal()">✕</button>
      <h3 id="emp-modal-title" style="margin-bottom: 1rem; color: var(--accent-indigo);">Add New Employee Record</h3>
      <form id="employee-form" onsubmit="DharmendiraModules.saveEmployeeForm(event)">
        <input type="hidden" id="emp-form-id" />
        
        <div class="form-row">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="emp-form-name" class="form-control" required placeholder="e.g. Ramesh Kumar" />
          </div>
          <div class="form-group">
            <label>Roll Number / Code *</label>
            <input type="text" id="emp-form-roll" class="form-control" required placeholder="e.g. 24MIS0199" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Department *</label>
            <select id="emp-form-dept" class="form-control" required>
              <option value="Engineering">Engineering</option>
              <option value="Human Resources">Human Resources</option>
              <option value="Finance">Finance</option>
              <option value="Operations">Operations</option>
            </select>
          </div>
          <div class="form-group">
            <label>Designation *</label>
            <input type="text" id="emp-form-designation" class="form-control" required placeholder="e.g. Software Engineer" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Basic Pay (₹ / month) *</label>
            <input type="number" id="emp-form-basic" class="form-control" required min="10000" step="1000" value="60000" />
          </div>
          <div class="form-group">
            <label>Special Allowance (₹ / month)</label>
            <input type="number" id="emp-form-allowance" class="form-control" required min="0" step="500" value="10000" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Bank Name</label>
            <input type="text" id="emp-form-bank" class="form-control" required value="HDFC Bank" />
          </div>
          <div class="form-group">
            <label>Bank Account Number</label>
            <input type="text" id="emp-form-account" class="form-control" required value="ACC987123456" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Tax Slab Regime</label>
            <select id="emp-form-tax" class="form-control">
              <option value="New Tax Regime (15%)">New Tax Regime (15%)</option>
              <option value="Old Tax Regime (20%)">Old Tax Regime (20%)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Assigned System Role</label>
            <select id="emp-form-role" class="form-control">
              <option value="Employee">Employee</option>
              <option value="Manager">Manager</option>
              <option value="HR Administrator">HR Administrator</option>
            </select>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="DharmendiraModules.closeEmployeeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Employee Record</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leave Request Modal -->
  <div id="leave-modal" class="modal-overlay">
    <div class="modal-container" style="max-width: 550px;">
      <button class="modal-close" onclick="BalamuruganModules.closeLeaveModal()">✕</button>
      <h3 style="margin-bottom: 1rem; color: var(--accent-amber);">Submit Leave Application</h3>
      <form id="leave-form" onsubmit="BalamuruganModules.saveLeaveForm(event)">
        <div class="form-group">
          <label>Employee *</label>
          <select id="leave-form-emp" class="form-control" required></select>
        </div>

        <div class="form-group">
          <label>Leave Classification *</label>
          <select id="leave-form-type" class="form-control" required>
            <option value="Casual Leave">Casual Leave (Paid)</option>
            <option value="Sick Leave">Sick Leave (Paid)</option>
            <option value="Unpaid Leave">Unpaid Leave / Loss of Pay (Deducted from Salary)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Date *</label>
            <input type="date" id="leave-form-start" class="form-control" required />
          </div>
          <div class="form-group">
            <label>End Date *</label>
            <input type="date" id="leave-form-end" class="form-control" required />
          </div>
        </div>

        <div class="form-group">
          <label>Reason for Leave *</label>
          <textarea id="leave-form-reason" class="form-control" rows="3" required placeholder="Provide brief justification..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="BalamuruganModules.closeLeaveModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Leave Application</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Itemized Salary Breakdown Modal -->
  <div id="salary-modal" class="modal-overlay">
    <div class="modal-container" style="max-width: 600px;">
      <button class="modal-close" onclick="DharmendiraModules.closeSalaryModal()">✕</button>
      <div id="salary-modal-body"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/app.js"></script>
  <script src="js/dharmendira_modules.js"></script>
  <script src="js/balamurugan_modules.js"></script>

</body>
</html>
